name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and validation dependencies
        run: python -m pip install -e ".[analytics,registry,table,filesystem,s3,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tools tests examples

      - name: Run tests
        run: python -B -m pytest -q -W error::DeprecationWarning

      - name: Check installed requirements
        run: python -m pip check

      - name: Run verified-registry quickstart
        run: python examples/quickstart.py

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build validation tools
        run: python -m pip install build==1.3.0 twine==6.2.0

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Check distribution metadata
        run: python -m twine check dist/*
